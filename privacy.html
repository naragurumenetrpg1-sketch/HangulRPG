<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>プライバシーポリシー</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c2233;--mut:#667;--ac:#9a6b00;--ln:#dde1ee}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--fg:#e8ecff;--mut:#99a3c7;--ac:#f2c94c;--ln:#27304d}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.85 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 20px 56px}
h1{font-size:1.5rem;margin:.2em 0 .1em}.app{color:var(--mut);margin:0 0 1.4em}
h2{font-size:1.05rem;margin:1.8em 0 .3em;color:var(--ac);border-bottom:1px solid var(--ln);padding-bottom:.2em}
p,ul{margin:.5em 0}ul{padding-left:1.3em}a{color:var(--ac)}
nav{margin-top:3em;padding-top:1em;border-top:1px solid var(--ln);color:var(--mut);font-size:.9rem}nav span{color:var(--fg);font-weight:600}
</style></head>
<body data-page="privacy"><main><div id="doc"><noscript>このページの表示には JavaScript が必要です。</noscript></div><nav id="nav"></nav></main>
<script src="js/app-info.js"></script><script src="js/legal-pages.js"></script></body></html>
